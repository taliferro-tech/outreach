<div class="unsubscribe-failure-container todd-page">
  <h1>That link didn't work</h1>
  @if ( done ) {
    <p class="success-message">You're unsubscribed. You won't get any more emails from this sender.</p>
  } @else {
    <p>Enter your email address and we'll stop sending to it.</p>
    <form (submit)="onSubmit(); $event.preventDefault()">
      <input type="email" placeholder="Email address" id="email" [(ngModel)]="email" name="email" autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="email" class="form-control large-text" required />
      <button type="submit" class="btn-todd" [disabled]="busy">{{ busy ? 'Unsubscribing…' : 'Unsubscribe' }}</button>
    </form>
  }
  @if ( errorMessage ) {
    <p class="error-message">{{ errorMessage }}</p>
  }
</div>
